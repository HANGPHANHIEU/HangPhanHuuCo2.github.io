<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Việc Gấp - Tìm việc gần bạn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="max-w-md mx-auto min-h-screen bg-white relative pb-24">
    
    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-slate-100 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-1.5">
        <div class="w-7 h-7 rounded-lg bg-teal-600 flex items-center justify-center">
          <i class="fa-solid fa-bolt text-white text-sm"></i>
        </div>
        <span class="text-xl font-extrabold tracking-tight text-slate-800">việcgấp<span class="text-teal-600">.</span></span>
      </div>
      <button onclick="showToast('Tính năng Đăng việc đang phát triển')" class="bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold px-3.5 py-2 rounded-full flex items-center gap-1.5 transition">
        <i class="fa-solid fa-plus text-xs"></i>
        <span>Đăng việc gấp</span>
      </button>
    </header>

    <main class="px-4 pt-5 pb-6">
      
      <!-- Title -->
      <div class="mb-5">
        <div class="flex items-center gap-2 mb-1">
          <h1 class="text-2xl font-bold text-slate-900">Việc gần bạn</h1>
          <i class="fa-solid fa-arrow-up-right-from-square text-teal-600 text-sm"></i>
        </div>
        <p class="text-slate-500 text-sm">Chọn việc phù hợp. Bắt đầu ngay hôm nay.</p>
        <div class="flex items-center gap-1.5 mt-2 text-xs text-slate-400">
          <span class="w-1.5 h-1.5 rounded-full bg-teal-500"></span>
          <span>Các việc bên dưới là dữ liệu mẫu</span>
        </div>
      </div>

      <!-- Featured Job Card -->
      <div class="gradient-green rounded-2xl p-5 mb-6 relative overflow-hidden card-shadow">
        <div class="absolute -right-6 -bottom-6 w-32 h-32 rounded-full bg-white/10"></div>
        <div class="absolute right-4 bottom-4 opacity-20">
          <i class="fa-solid fa-bicycle text-6xl text-white"></i>
        </div>
        
        <div class="relative z-10">
          <span class="inline-flex items-center gap-1 bg-amber-400 text-amber-900 text-xs font-bold px-2.5 py-1 rounded-full mb-3">
            <i class="fa-solid fa-bolt text-[10px]"></i>
            Cần người ngay
          </span>
          
          <h2 class="text-white text-xl font-bold leading-snug mb-2">
            Một chuyến giao hàng.<br>Một khoản thu nhập ngay.
          </h2>
          
          <p class="text-teal-100 text-sm mb-4">
            Quận 3 · Trong 30 phút · <span class="font-semibold text-white">180.000đ / chuyến</span>
          </p>
          
          <button onclick="showJobDetail(1)" class="bg-white text-teal-700 font-semibold text-sm px-4 py-2.5 rounded-xl flex items-center gap-2 hover:bg-teal-50 transition">
            Xem việc này
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </button>
        </div>
      </div>

      <!-- Search -->
      <div class="relative mb-3">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <input 
          type="text" 
          id="searchInput"
          placeholder="Bạn muốn làm việc gì?" 
          class="w-full bg-slate-100 border-0 rounded-xl py-3 pl-10 pr-4 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition"
          oninput="filterJobs()"
        />
      </div>

      <!-- Location Filter -->
      <div class="relative mb-4">
        <i class="fa-solid fa-location-dot absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
        <select 
          id="locationSelect"
          class="w-full bg-slate-100 border-0 rounded-xl py-3 pl-10 pr-10 text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-teal-500 focus:bg-white transition"
          onchange="filterJobs()"
        >
          <option value="all">Tất cả khu vực</option>
          <option value="quan1">Quận 1</option>
          <option value="quan3">Quận 3</option>
          <option value="quan7">Quận 7</option>
          <option value="binhthanh">Bình Thạnh</option>
          <option value="thuduc">Thủ Đức</option>
        </select>
        <i class="fa-solid fa-chevron-down absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>
      </div>

      <!-- Categories -->
      <div class="flex gap-2 overflow-x-auto pb-2 mb-5 -mx-1 px-1">
        <button onclick="setCategory('all')" class="category-btn active flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium border border-slate-200 bg-teal-600 text-white">
          Tất cả
        </button>
        <button onclick="setCategory('giaohang')" class="category-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium border border-slate-200 bg-white text-slate-600 hover:border-teal-300">
          Giao hàng
        </button>
        <button onclick="setCategory('dondep')" class="category-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium border border-slate-200 bg-white text-slate-600 hover:border-teal-300">
          Dọn dẹp
        </button>
        <button onclick="setCategory('suachua')" class="category-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium border border-slate-200 bg-white text-slate-600 hover:border-teal-300">
          Sửa chữa
        </button>
        <button onclick="setCategory('phucvu')" class="category-btn flex-shrink-0 px-4 py-2 rounded-full text-sm font-medium border border-slate-200 bg-white text-slate-600 hover:border-teal-300">
          Phục vụ
        </button>
      </div>

      <!-- Results Header -->
      <div class="flex items-center justify-between mb-4">
        <p class="text-sm font-semibold text-slate-700">
          <span id="jobCount">6</span> việc phù hợp
        </p>
        <div class="flex items-center gap-3 text-sm">
          <label class="flex items-center gap-1.5 text-slate-500 cursor-pointer">
            <input type="checkbox" id="urgentOnly" class="rounded text-teal-600 focus:ring-teal-500" onchange="filterJobs()" />
            <span>Chỉ việc gấp</span>
          </label>
          <button class="flex items-center gap-1 text-slate-500 hover:text-teal-600">
            <i class="fa-solid fa-arrow-up-arrow-down text-xs"></i>
            <span>Gần nhất</span>
          </button>
        </div>
      </div>

      <!-- Job List -->
      <div id="jobList" class="space-y-3"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-100 bottom-nav safe-bottom z-50">
      <div class="flex items-center justify-around py-2">
        <button onclick="setNav('timviec')" class="nav-item active flex flex-col items-center gap-0.5 py-1 px-4">
          <i class="fa-solid fa-magnifying-glass text-lg"></i>
          <span class="text-[11px] font-medium">Tìm việc</span>
        </button>
        <button onclick="setNav('danhan')" class="nav-item flex flex-col items-center gap-0.5 py-1 px-4 text-slate-400">
          <i class="fa-solid fa-briefcase text-lg"></i>
          <span class="text-[11px] font-medium">Đã nhận</span>
        </button>
        <button onclick="showToast('Tính năng Đăng việc đang phát triển')" class="nav-item flex flex-col items-center gap-0.5 py-1 px-4 text-slate-400">
          <div class="w-10 h-10 -mt-5 rounded-full bg-teal-600 flex items-center justify-center shadow-lg">
            <i class="fa-solid fa-plus text-white text-lg"></i>
          </div>
          <span class="text-[11px] font-medium mt-0.5">Đăng việc</span>
        </button>
      </div>
    </nav>

    <!-- Toast -->
    <div id="toast" class="fixed top-20 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-sm px-4 py-2.5 rounded-xl shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-[100] max-w-xs text-center">
    </div>

    <!-- Job Detail Modal -->
    <div id="jobModal" class="fixed inset-0 z-[90] hidden">
      <div class="absolute inset-0 bg-black/40" onclick="closeModal()"></div>
      <div class="absolute bottom-0 left-0 right-0 max-w-md mx-auto bg-white rounded-t-3xl max-h-[85vh] overflow-y-auto">
        <div class="sticky top-0 bg-white pt-3 pb-2 px-5 border-b border-slate-100">
          <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto mb-3"></div>
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold text-slate-900">Chi tiết việc</h3>
            <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center">
              <i class="fa-solid fa-xmark text-slate-500"></i>
            </button>
          </div>
        </div>
        <div id="modalContent" class="p-5"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
